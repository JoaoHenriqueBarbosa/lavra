[package]
name = "lavrac"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
description = "Compilador da Lavra, a linguagem compilada em que cada instrução é uma oração em português."
license = "MIT"
repository = "https://github.com/JoaoHenriqueBarbosa/lavra"
homepage = "https://github.com/JoaoHenriqueBarbosa/lavra"
readme = "README.md"
authors = ["João Henrique Barbosa <joaohenriquebarbosa21@gmail.com>"]
keywords = ["compiler", "programming-language", "portuguese", "interpreter", "language-server"]
categories = ["compilers", "command-line-utilities", "development-tools"]
exclude = [".github/", "editors/", "notes/", "tools/", "playground/", "site/", "release-plz.toml", "CLAUDE.md"]
default-run = "lavrac"
build = "build.rs"

[lib]
name = "lavra"
path = "src/lib.rs"

[[bin]]
name = "lavrac"
path = "src/main.rs"
required-features = ["native", "lsp", "dap"]

[features]
default = ["native", "lsp", "dap"]
# O adaptador de depuração (`lavrac dap`): o protocolo com o editor, a thread do programa e
# o terminal integrado. O núcleo do depurador (`debug`) fica na biblioteca sem ele.
dap = []
# O back-end nativo: o Cranelift e o runtime que o build.rs compila. Sem ele, a biblioteca
# (análise e interpretador) compila também para wasm32, para o playground.
# O servidor de linguagem (`lavrac lsp`).
lsp = ["dep:lsp-server", "dep:lsp-types"]
native = ["dep:cranelift-codegen", "dep:cranelift-frontend", "dep:cranelift-module", "dep:cranelift-object", "dep:cranelift-native"]

[dependencies]
cranelift-codegen = { version = "0.137", optional = true }
cranelift-frontend = { version = "0.137", optional = true }
cranelift-module = { version = "0.137", optional = true }
cranelift-object = { version = "0.137", optional = true }
cranelift-native = { version = "0.137", optional = true }
serde_json = "1"
lsp-server = { version = "0.10", optional = true }
lsp-types = { version = "0.97", optional = true }
serde = { version = "1", features = ["derive"] }

[profile.release]
debug = false
