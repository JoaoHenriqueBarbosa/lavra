name: Site

# O site da Lavra no GitHub Pages: o interpretador em wasm (playground/), conferido contra o
# corpus no Node e num navegador de verdade (cada poema roda no playground do Chrome do
# runner e dá a saída esperada), e as páginas geradas do repositório (site/build.mjs).

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Gera e confere
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "playground -> ../target/playground"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - name: O interpretador em wasm
        working-directory: playground
        env:
          CARGO_TARGET_DIR: ../target/playground
        run: |
          cargo fmt --check
          cargo clippy --locked -- -D warnings
          cargo build --locked --release --target wasm32-unknown-unknown
          wasm=../target/playground/wasm32-unknown-unknown/release/lavra_playground.wasm
          wasm-bindgen --target web --out-dir ../target/playground/web "$wasm"
          wasm-bindgen --target nodejs --out-dir ../target/playground/node "$wasm"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: O site, conferido no Node e no navegador
        working-directory: site
        run: |
          npm ci
          node test-wasm.mjs
          node build.mjs
          CHROME="$(command -v google-chrome || command -v chromium)" node check-browser.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: Publica
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
