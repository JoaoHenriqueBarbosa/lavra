[package]
name = "lavra-playground"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "O interpretador da Lavra no navegador (wasm32), para o playground do site."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# A análise e o interpretador, sem o back-end nativo nem as ferramentas de editor.
lavrac = { path = "..", default-features = false }
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

# Fora do pacote do compilador: este crate só existe para o site.
[workspace]
